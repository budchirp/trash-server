spring:
  application:
    name: trash-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/trash?currentSchema=public}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      connection-init-sql: create schema if not exists public
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: public
    show-sql: false
  messages:
    basename: i18n/messages
  jackson:
    property-naming-strategy: SNAKE_CASE

springdoc:
  api-docs:
    path: /openapi.json
  swagger-ui:
    enabled: true
    path: /swagger

app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-change-this-development-secret-change-this-development-secret}
    issuer: ${JWT_ISSUER:trash-server}
    audience: ${JWT_AUDIENCE:trash-api}

storage:
  s3:
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
    bucket: ${S3_BUCKET:trash-storage}
    region: ${S3_REGION:us-east-1}
    endpoint: ${S3_ENDPOINT:}